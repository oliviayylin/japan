  .hero::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,12,8,0) 30%,rgba(12,14,10,.55) 70%,rgba(10,11,8,.86) 100%);
  }
  .hero-inner{position:relative;z-index:1;padding:20px 20px 18px;width:100%;}
  .hero-eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#F2D9C9;margin:0 0 8px;}
  .hero h1{font-size:26px;line-height:1.28;margin:0 0 8px;font-weight:800;text-wrap:balance;text-shadow:0 1px 12px rgba(0,0,0,.25);}
  .hero-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;font-size:14px;color:rgba(255,255,255,.88);}
  .hero-pill{font-family:var(--mono);font-weight:700;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:3px 10px;}

  /* Lock screen */
  .lockwrap{display:flex;align-items:center;justify-content:center;padding:26px 20px 40px;}
  .lockcard{width:100%;max-width:340px;background:var(--paper-raised);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 22px var(--shadow);padding:28px 26px;text-align:center;margin-top:-46px;position:relative;z-index:2;}
  .lockcard svg.lock-icon{width:30px;height:30px;color:var(--accent);margin:0 auto 12px;display:block;}
  .lockcard h2{font-size:17px;margin:0 0 4px;font-weight:800;}
  .lockcard p.hint{font-size:14px;color:var(--ink-soft);margin:0 0 18px;line-height:1.6;}
  .lockcard input{width:100%;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-align:center;letter-spacing:.04em;font-family:var(--mono);}
  .lockcard input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .lockcard button{margin-top:12px;width:100%;font-size:16px;font-weight:700;padding:11px 12px;border-radius:10px;border:none;background:var(--accent-strong);color:#fff;cursor:pointer;font-family:var(--sans);}
  .lockcard button:active{opacity:.85;}
  .lockcard .err{min-height:18px;font-size:14px;color:var(--accent-ink);margin-top:10px;}
  .lockcard .remember{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;font-size:13.5px;color:var(--ink-soft);}
  .lockcard .remember input{width:auto;padding:0;}
  .clear-session-wrap{display:flex;justify-content:center;padding:6px 0 24px;}
  .clear-session-btn{background:none;border:none;color:var(--ink-soft);font-family:var(--sans);font-size:13px;text-decoration:underline;cursor:pointer;padding:4px;}
  @media (prefers-reduced-motion:no-preference){.lockcard.shake{animation:shake .35s ease;}}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

  .tabbar{position:sticky;top:0;z-index:5;display:flex;gap:7px;overflow-x:auto;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line);scrollbar-width:none;}
  .tabbar::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;padding:7px 15px;border-radius:999px;border:none;background:var(--tag-bg);color:var(--ink-soft);font-family:var(--sans);font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .tab[aria-selected="true"]{color:#fff;background:var(--accent-strong);font-weight:700;}
  main{padding:18px 18px 40px;max-width:640px;margin:0 auto;}
  .page{display:flex;flex-direction:column;gap:18px;scroll-margin-top:60px;padding-bottom:84px;}
  .page[hidden]{display:none;}
  .page + .page{border-top:1px solid var(--line);padding-top:22px;margin-top:8px;}
  .day-head{display:flex;flex-direction:column;gap:8px;margin-bottom:2px;}
  .day-head-top{display:flex;align-items:center;gap:9px;}
  .date-tag{font-family:var(--mono);font-size:14.5px;font-weight:700;color:var(--ink);background:var(--tag-bg);border-radius:8px;padding:4px 10px;flex:0 0 auto;}
  .date-tag span{opacity:.5;margin:0 1px;font-weight:400;}
  .wd-text{font-size:14px;color:var(--ink-soft);}
  .day-head h2{margin:0;font-size:23px;font-weight:800;text-wrap:balance;}
  .card{background:none;border:none;box-shadow:none;padding:0;}
  .boarding-pass{background:#FFFFFF;border:1px solid rgba(0,0,0,.08);box-shadow:0 2px 10px rgba(0,0,0,.08);border-radius:var(--radius);padding:18px 16px;display:flex;align-items:center;gap:14px;}
  .bp-leg{flex:1;text-align:center;}
  .bp-leg .code{font-family:var(--mono);font-weight:800;font-size:22px;color:#1A1A1A;}
  .bp-leg .place{font-size:12.5px;color:#55504A;margin-top:2px;}
  .bp-leg .time{font-family:var(--mono);font-size:16.5px;margin-top:8px;font-weight:700;color:#1F5C4E;}
  .bp-mid{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;color:#55504A;}
  .bp-mid .line{width:60px;height:1px;background:#3F8C79;opacity:.6;position:relative;}
  .bp-mid .line::after{content:"✈";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);font-size:12px;color:#3F8C79;}
  .bp-mid .flight{font-family:var(--mono);font-size:11.5px;margin-top:4px;}
  .bp-mid .flightno{font-family:var(--mono);font-size:12.5px;font-weight:700;color:#1F5C4E;margin-top:3px;}

  /* Unified day flow: events + connectors */
  .day-flow{display:flex;flex-direction:column;}
  .ev{display:grid;grid-template-columns:56px 1fr;column-gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);}
  .ev:last-child{border-bottom:none;}
  .ev-icon{width:56px;height:56px;border-radius:14px;background:var(--tag-bg);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .ev-icon img{width:28px;height:28px;object-fit:contain;}
  .ev-right{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .ev-time{font-family:var(--mono);font-size:13.5px;color:var(--ink-soft);font-weight:700;}
  .ev-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .tbd{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent-ink);border:1px dashed var(--accent);border-radius:6px;padding:1px 7px;letter-spacing:.04em;}
  .ev-hours{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--accent-ink);}
  .ev-sub{font-size:14px;color:var(--ink-soft);}

  .banner{display:flex;gap:10px;align-items:flex-start;border:none;background:var(--accent-soft);border-radius:var(--radius);padding:12px 14px;font-size:14.5px;line-height:1.6;color:var(--accent-ink);}
  .banner b{display:block;font-size:14.5px;margin-bottom:2px;}
  .ov-list{display:flex;flex-direction:column;}
  .ov-row{display:flex;align-items:center;gap:14px;background:none;border:none;border-bottom:1px solid var(--line);padding:14px 2px;cursor:pointer;text-align:left;width:100%;font-family:var(--sans);color:var(--ink);}
  .ov-row:last-child{border-bottom:none;}
  .ov-row .date-tag{width:46px;text-align:center;font-size:14px;}
  .ov-body{flex:1;min-width:0;}
  .ov-body .ttl{font-weight:700;font-size:16px;margin:0 0 3px;}
  .ov-body .sub{font-size:14px;color:var(--ink-soft);margin:0;}
  .ov-body .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .tag{font-size:12px;font-family:var(--mono);border:none;border-radius:6px;padding:2px 7px;}
  .tag-c0{color:var(--pine);background:var(--pine-soft);}
  .tag-c1{color:var(--accent-ink);background:var(--accent-soft);}
  .tag-c2{color:var(--stay);background:var(--stay-soft);}
  .tag-c3{color:var(--shop);background:var(--shop-soft);}
  .ov-arrow{color:var(--line);font-size:17px;flex:0 0 auto;}

  .geo-mini-wrap{margin-bottom:2px;}
  .geo-mini{background:var(--tag-bg);border-radius:var(--radius);padding:10px;}
  .geo-mini-label{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:2px 4px 8px;}
  .geo-map{width:100%;height:200px;border-radius:calc(var(--radius) - 4px);overflow:hidden;background:var(--line);}
  .geo-map-overview{height:260px;}
  .leaflet-container{background:var(--tag-bg);font-family:var(--sans);}
  .leaflet-popup-content{font-size:14px;font-weight:700;margin:8px 10px;color:var(--ink);}
  .leaflet-popup-content-wrapper{border-radius:10px;background:var(--paper-raised);color:var(--ink);}
  .leaflet-popup-tip{background:var(--paper-raised);}

  .geo-card{padding:16px 4px;}
  .geo-svg{width:100%;height:auto;display:block;}
  .geo-line{stroke:var(--accent);stroke-width:2;opacity:.55;}
  .geo-label rect{fill:var(--tag-bg);}
  .geo-label text{font-family:var(--mono);font-size:10.5px;fill:var(--accent-ink);text-anchor:middle;dominant-baseline:middle;}
  .geo-node circle{fill:var(--paper-raised);stroke:var(--accent);stroke-width:2;}
  .geo-node text{font-family:var(--sans);font-size:13px;font-weight:700;fill:var(--ink);text-anchor:middle;}
  .geo-node-end circle{fill:var(--accent);stroke:var(--accent);}

  .extra-wrap{margin-top:4px;}
  .extra-card{
    background-color:var(--paper);
    background-image:
      linear-gradient(to right, var(--extra-line) 50%, transparent 50%),
      linear-gradient(to right, var(--extra-line) 50%, transparent 50%),
      linear-gradient(to bottom, var(--extra-line) 50%, transparent 50%),
      linear-gradient(to bottom, var(--extra-line) 50%, transparent 50%);
    background-position:left top, left bottom, left top, right top;
    background-repeat:repeat-x, repeat-x, repeat-y, repeat-y;
    background-size:18px 2px, 18px 2px, 2px 18px, 2px 18px;
    border-radius:0;
    padding:14px 16px;
  }
  .extra-title{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pine);margin:0 0 10px;}
  .extra-list{display:flex;flex-direction:column;gap:9px;}
  .extra-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .extra-main{font-size:15px;font-weight:600;color:var(--ink);}
  .extra-loc{font-size:15px;color:var(--ink-soft);}

  .jp-section{display:flex;flex-direction:column;gap:2px;}
  .jp-section-title{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:2px 4px 8px;}
  .jp-list{display:flex;flex-direction:column;}
  .jp-row{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding:12px 2px;}
  .jp-row:last-child{border-bottom:none;}
  .jp-kanji{font-size:16px;font-weight:700;flex:1 1 0;min-width:0;}

  var SESSION_KEY = "nagoya_trip_session";
  var SESSION_TTL_MS = 14 * 24 * 60 * 60 * 1000; // 14 天

  function b64ToBytes(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++){ bytes[i] = bin.charCodeAt(i); }
    return bytes;
  }

  function bytesToB64(bytes){
    var bin = "";
    for (var i = 0; i < bytes.length; i++){ bin += String.fromCharCode(bytes[i]); }
    return btoa(bin);
  }

  function hasStorage(){
    try {
      return typeof window.localStorage !== "undefined" && window.localStorage !== null;
    } catch(e){
      return false;
    }
  }

  async function saveSession(rawKeyBytes){
    if(!hasStorage()) return;
    try {
      var payload = JSON.stringify({
        key: bytesToB64(rawKeyBytes),
        expires: Date.now() + SESSION_TTL_MS
      });
      window.localStorage.setItem(SESSION_KEY, payload);
    } catch(e){ /* ignore storage failures */ }
  }

  async function loadSession(){
    if(!hasStorage()) return null;
    try {
      var raw = window.localStorage.getItem(SESSION_KEY);
      if(!raw) return null;
      var session = JSON.parse(raw);
      if(!session.expires || Date.now() >= session.expires) return null;
      return session;
    } catch(e){
      return null;
    }
  }

  async function clearSession(){
    if(!hasStorage()) return;
    try { window.localStorage.removeItem(SESSION_KEY); } catch(e){ /* ignore */ }
  }

  async function tryUnlock(password){
    try {
      var enc = new TextEncoder();
      var keyMaterial = await crypto.subtle.importKey(
        "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
      );
      var key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64ToBytes(ENC.salt), iterations: ENC.iterations, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        true,
        ["decrypt"]
      );
      var plainBuf = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(ENC.iv) },
        key,
        b64ToBytes(ENC.ciphertext)
      );
      var plaintext = new TextDecoder().decode(plainBuf);
      var data = JSON.parse(plaintext);
      var rawKeyBytes = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      return { data: data, rawKeyBytes: rawKeyBytes };
    } catch (e){
      return null;
    }
  }

  async function decryptWithRawKey(rawKeyBytes){
    var key = await crypto.subtle.importKey("raw", rawKeyBytes, { name: "AES-GCM" }, false, ["decrypt"]);
    var plainBuf = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(ENC.iv) },
      key,
      b64ToBytes(ENC.ciphertext)
    );
    var plaintext = new TextDecoder().decode(plainBuf);
    return JSON.parse(plaintext);
  }

  function showError(msg){
    var card = document.getElementById("lockcard");
    document.getElementById("pwErr").textContent = msg;
    card.classList.remove("shake");
    void card.offsetWidth;
    card.classList.add("shake");
  }

  function renderApp(data){
    document.getElementById("lockwrap").hidden = true;
    var clearWrap = document.getElementById("clearSessionWrap");
    if(clearWrap) clearWrap.hidden = false;

    var mainEl = document.getElementById("mainContent");
    mainEl.innerHTML = data.mainHTML;
    mainEl.hidden = false;
    document.querySelectorAll(".page").forEach(function(p){ p.hidden = false; });

    var tabbar = document.getElementById("tabbar");
    tabbar.hidden = false;

    var days = data.days;
    var tabsMeta = [{id:"overview", label:"總覽"}, {id:"transit", label:"交通"}];
    days.forEach(function(d,i){ tabsMeta.push({id:d.id, label:"D"+(i+1)}); });
    tabsMeta.push({id:"jphelper", label:"日文小幫手"});

    var daysById = {};
    days.forEach(function(d){ daysById[d.id] = d; });

    var initedMaps = {};
    var MAP_ACCENT = getComputedStyle(document.documentElement).getPropertyValue("--accent-strong").trim() || "#3F8C79";

    function mapDot(){
      return L.divIcon({className:"", iconSize:[12,12], iconAnchor:[6,6],
        html:'<div style="width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid '+MAP_ACCENT+';box-shadow:0 1px 3px rgba(0,0,0,.3);"></div>'});
    }
    function mapEndDot(){
      return L.divIcon({className:"", iconSize:[14,14], iconAnchor:[7,7],
        html:'<div style="width:14px;height:14px;border-radius:50%;background:'+MAP_ACCENT+';border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);"></div>'});
    }

    function buildRouteMap(dayId, points){
      var el = document.getElementById("map-" + dayId);
      if(!el || initedMaps[dayId] || !window.L) return;
      var map = L.map(el, {zoomControl:false, scrollWheelZoom:false});
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom:18, attribution:"&copy; OpenStreetMap"
      }).addTo(map);
      L.control.zoom({position:"bottomright"}).addTo(map);
      var latlngs = points.map(function(p){ return [p.lat, p.lng]; });
      L.polyline(latlngs, {color:MAP_ACCENT, weight:3, opacity:.8}).addTo(map);
      points.forEach(function(p,i){
        L.marker([p.lat, p.lng], {icon: i === points.length-1 ? mapEndDot() : mapDot()})
          .addTo(map).bindPopup(p.label);
      });
      map.fitBounds(L.latLngBounds(latlngs), {padding:[24,24]});
      initedMaps[dayId] = map;
    }

    tabsMeta.forEach(function(t){
      var btn = document.createElement("button");
      btn.className = "tab";
      btn.type = "button";
      btn.setAttribute("role","tab");
      btn.dataset.target = t.id;
      btn.textContent = t.label;
      btn.addEventListener("click", function(){ showPage(t.id); });
      tabbar.appendChild(btn);
    });

    function setActiveTab(id){
      document.querySelectorAll(".tab").forEach(function(b){
        b.setAttribute("aria-selected", b.dataset.target === id ? "true" : "false");
      });
      var active = document.querySelector('.tab[data-target="'+id+'"]');
      if(active) active.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"});
    }

    function showPage(id){
      var el = document.getElementById(id);
      if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
      setActiveTab(id);
    }

    function geoPointsFor(id){
      return id === "overview" ? data.overviewGeo : (daysById[id] && daysById[id].geo);
    }

    // Lazy-init each day's route map only once it scrolls near the viewport.
    var mapObserver = ("IntersectionObserver" in window) ? new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(!entry.isIntersecting) return;
        var geoPoints = geoPointsFor(entry.target.id);
        if(geoPoints && geoPoints.length && !initedMaps[entry.target.id]){
          buildRouteMap(entry.target.id, geoPoints);
        }
        mapObserver.unobserve(entry.target);
      });
    }, {rootMargin:"300px 0px 300px 0px"}) : null;

    document.querySelectorAll(".page").forEach(function(p){
      var geoPoints = geoPointsFor(p.id);
      if(!geoPoints || !geoPoints.length) return;
      if(mapObserver) mapObserver.observe(p);
      else buildRouteMap(p.id, geoPoints);
    });

    // Scroll-spy: highlight whichever section's tab as the user scrolls past it.
    if("IntersectionObserver" in window){
      var tabObserver = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if(entry.isIntersecting) setActiveTab(entry.target.id);
        });
      }, {rootMargin:"-45% 0px -50% 0px", threshold:0});
      document.querySelectorAll(".page").forEach(function(p){ tabObserver.observe(p); });
    }

    var ovList = document.getElementById("ovList");
    days.forEach(function(d){
      var card = document.createElement("button");
      card.className = "ov-row";
      card.type = "button";
      card.addEventListener("click", function(){ showPage(d.id); });

      var badge = document.createElement("span");
      badge.className = "date-tag";
      badge.innerHTML = d.month + "<span>/</span>" + d.day;
      card.appendChild(badge);

      var body = document.createElement("div");
      body.className = "ov-body";
      var ttl = document.createElement("p");
      ttl.className = "ttl";
      ttl.textContent = "Day " + (days.indexOf(d)+1) + "・" + d.ttl;
      var sub = document.createElement("p");
      sub.className = "sub";
      sub.textContent = d.sub;
      var tags = document.createElement("div");
      tags.className = "tags";
      d.tags.forEach(function(tg){
        var s = document.createElement("span");
        var hash = 0;
        for(var i=0;i<tg.length;i++){ hash = (hash*31 + tg.charCodeAt(i)) % 4; }
        s.className = "tag tag-c" + Math.abs(hash);
        s.textContent = tg;
        tags.appendChild(s);
      });
      body.appendChild(ttl); body.appendChild(sub); body.appendChild(tags);
      card.appendChild(body);

      var arrow = document.createElement("span");
      arrow.className = "ov-arrow";
      arrow.textContent = "›";
      card.appendChild(arrow);

      ovList.appendChild(card);
    });

    // Auto-jump to today's day page if the device's real date falls inside the trip.
    var TRIP_YEAR = 2026;
    var todayId = null;
    var now = new Date();
    days.forEach(function(d){
      if(now.getFullYear() === TRIP_YEAR &&
         (now.getMonth() + 1) === parseInt(d.month, 10) &&
         now.getDate() === parseInt(d.day, 10)){
        todayId = d.id;
      }
    });
    if(todayId){
      var todayEl = document.getElementById(todayId);
      if(todayEl) todayEl.scrollIntoView({behavior:"auto", block:"start"});
      setActiveTab(todayId);
    } else {
      setActiveTab("overview");
    }
  }

  async function attemptUnlock(){
    var pw = document.getElementById("pwInput").value;
    if(!pw){ showError("請輸入密碼"); return; }
    var btn = document.getElementById("unlockBtn");
    btn.disabled = true;
    btn.textContent = "解鎖中…";
    var result = await tryUnlock(pw);
    btn.disabled = false;
    btn.textContent = "解鎖";
    if(!result){
      showError("密碼錯誤，請再試一次");
      return;
    }
    var rememberCheck = document.getElementById("rememberCheck");
    if(rememberCheck && rememberCheck.checked){
      await saveSession(result.rawKeyBytes);
    }
    renderApp(result.data);
  }

  async function init(){
    var session = await loadSession();
    if(session){
      try {
        var rawKeyBytes = b64ToBytes(session.key);
        var data = await decryptWithRawKey(rawKeyBytes);
        renderApp(data);
        return;
      } catch(e){
        await clearSession();
      }
    }
    // no valid session: show lock screen (already visible by default)
  }

  document.getElementById("unlockBtn").addEventListener("click", attemptUnlock);
  document.getElementById("pwInput").addEventListener("keydown", function(e){
    if(e.key === "Enter"){ attemptUnlock(); }
  });
  var clearBtn = document.getElementById("clearSessionBtn");
  if(clearBtn){
    clearBtn.addEventListener("click", async function(){
      await clearSession();
      window.location.reload();
    });
  }

  init();
})();
</script>
