<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日路線地圖（真實地圖版）mockup</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root{
    --paper:#FFFFFF;--paper-raised:#FFFFFF;--ink:#262421;--ink-soft:#7A7266;
    --accent:#5CAE9C;--accent-ink:#34655A;--accent-soft:#CCE3DE;--accent-strong:#3F8C79;
    --tag-bg:#F6F5F2;--line:#E6E1D8;--shadow:rgba(38,36,33,0.10);--radius:16px;
    --note-bg:#FBF3E4;--note-line:#E4C98A;--note-ink:#7A5A17;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Hiragino Sans","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono","Menlo","Consolas",monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  .reviewnote{background:var(--note-bg);border-bottom:1px solid var(--note-line);color:var(--note-ink);font-size:12.5px;line-height:1.6;padding:10px 18px;text-align:center;}
  .app{max-width:640px;margin:0 auto;}
  .hero{position:relative;min-height:120px;display:flex;align-items:flex-end;background:#1a1f18 linear-gradient(160deg,#2b3a2c,#1a1f18);color:#fff;}
  .hero-inner{padding:16px 20px 14px;}
  .hero h1{font-size:19px;margin:0;font-weight:800;}
  .tabbar{display:flex;gap:7px;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line);}
  .tab{padding:7px 15px;border-radius:999px;border:none;background:var(--tag-bg);color:var(--ink-soft);font-size:13px;font-weight:600;cursor:pointer;}
  .tab[aria-selected="true"]{color:#fff;background:var(--accent-strong);font-weight:700;}
  main{padding:18px;}
  .page[hidden]{display:none;}
  .day-head{margin-bottom:12px;}
  .date-tag{font-family:var(--mono);font-size:13px;font-weight:700;background:var(--tag-bg);border-radius:8px;padding:4px 10px;}
  .wd-text{font-size:12.5px;color:var(--ink-soft);margin-left:8px;}
  .day-head h2{margin:8px 0 0;font-size:20px;font-weight:800;}

  .geo-mini-wrap{position:relative;margin-bottom:16px;}
  .geo-mini-flag{position:absolute;top:-9px;right:10px;z-index:400;font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--accent-strong);background:var(--paper);border:1px solid var(--accent);border-radius:999px;padding:1px 8px;}
  .geo-mini{background:var(--tag-bg);border:1px dashed var(--accent);border-radius:var(--radius);padding:10px;}
  .geo-mini-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:2px 4px 8px;}
  .geo-map{width:100%;height:230px;border-radius:calc(var(--radius) - 4px);overflow:hidden;background:#e9e5dc;}

  .leaflet-popup-content{font-family:var(--sans);font-size:12.5px;font-weight:700;margin:8px 10px;}
  .leaflet-popup-content-wrapper{border-radius:10px;}

  .card{margin-top:16px;}
  .ev{display:grid;grid-template-columns:44px 1fr;column-gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .ev:last-child{border-bottom:none;}
  .ev-icon{font-size:20px;width:44px;height:44px;border-radius:12px;background:var(--tag-bg);display:flex;align-items:center;justify-content:center;}
  .ev-title{font-size:14px;font-weight:700;}
  .ev-sub{font-size:12px;color:var(--ink-soft);}
</style>
</head>
<body>

<div class="reviewnote">這是「今日路線」改用<b>真實地圖（OpenStreetMap）</b>的提案 mockup — 標點、路線都是實際地理座標</div>

<div class="app">
  <div class="hero"><div class="hero-inner"><h1>名古屋・高山・上高地 家族旅行</h1></div></div>

  <nav class="tabbar">
    <button class="tab" type="button" data-target="day2" aria-selected="true">D2</button>
    <button class="tab" type="button" data-target="day3" aria-selected="false">D3</button>
  </nav>

  <main>
    <section class="page" id="day2">
      <div class="day-head">
        <span class="date-tag">10/4</span><span class="wd-text">週日</span>
        <h2>高山老街・和服體驗 → 上高地</h2>
      </div>
      <div class="geo-mini-wrap">
        <span class="geo-mini-flag">新增</span>
        <div class="geo-mini">
          <p class="geo-mini-label">今日路線</p>
          <div class="geo-map" id="map-day2"></div>
        </div>
      </div>
      <div class="card">
        <div class="ev"><div class="ev-icon">🍵</div><div><div class="ev-title">早餐：Brand New Day Coffee</div><div class="ev-sub">步行8分鐘</div></div></div>
        <div class="ev"><div class="ev-icon">👘</div><div><div class="ev-title">10:00 和服體驗「中田呉服店」</div></div></div>
        <div class="ev"><div class="ev-icon">🚗</div><div><div class="ev-title">15:00 前往平湯溫泉</div></div></div>
        <div class="ev"><div class="ev-icon">🏨</div><div><div class="ev-title">17:00 抵達上高地，飯店放行李</div></div></div>
      </div>
    </section>

    <section class="page" id="day3" hidden>
      <div class="day-head">
        <span class="date-tag">10/5</span><span class="wd-text">週一</span>
        <h2>上高地一日遊 → 平湯溫泉</h2>
      </div>
      <div class="geo-mini-wrap">
        <span class="geo-mini-flag">新增</span>
        <div class="geo-mini">
          <p class="geo-mini-label">今日路線</p>
          <div class="geo-map" id="map-day3"></div>
        </div>
      </div>
      <div class="card">
        <div class="ev"><div class="ev-icon">🍚</div><div><div class="ev-title">07:30 早餐：白樺莊飯店自助式早餐</div></div></div>
        <div class="ev"><div class="ev-icon">🥾</div><div><div class="ev-title">河童橋 ⟷ 明神橋 健行</div></div></div>
        <div class="ev"><div class="ev-icon">🥾</div><div><div class="ev-title">河童橋 ⟷ 大正池 健行</div></div></div>
        <div class="ev"><div class="ev-icon">🚌</div><div><div class="ev-title">17:00 搭巴士回平湯溫泉</div></div></div>
      </div>
    </section>
  </main>
</div>

<script>
  document.querySelectorAll(".tab").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll(".tab").forEach(function(b){ b.setAttribute("aria-selected", b === btn ? "true" : "false"); });
      document.querySelectorAll(".page").forEach(function(p){ p.hidden = (p.id !== btn.dataset.target); });
      setTimeout(function(){ if(window._maps && window._maps[btn.dataset.target]) window._maps[btn.dataset.target].invalidateSize(); }, 50);
    });
  });

  var ACCENT = "#3F8C79";
  window._maps = {};

  function dot(){
    return L.divIcon({
      className: "",
      html: '<div style="width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid '+ACCENT+';box-shadow:0 1px 3px rgba(0,0,0,.3);"></div>',
      iconSize: [12,12], iconAnchor: [6,6]
    });
  }
  function endDot(){
    return L.divIcon({
      className: "",
      html: '<div style="width:14px;height:14px;border-radius:50%;background:'+ACCENT+';border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3);"></div>',
      iconSize: [14,14], iconAnchor: [7,7]
    });
  }

  function buildRouteMap(elId, points){
    var map = L.map(elId, {zoomControl:false, attributionControl:true, scrollWheelZoom:false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);
    L.control.zoom({position:'bottomright'}).addTo(map);

    var latlngs = points.map(function(p){ return [p.lat, p.lng]; });
    L.polyline(latlngs, {color: ACCENT, weight: 3, opacity: .8}).addTo(map);

    points.forEach(function(p, i){
      var icon = (i === points.length - 1) ? endDot() : dot();
      L.marker([p.lat, p.lng], {icon: icon}).addTo(map).bindPopup(p.label);
    });

    map.fitBounds(L.latLngBounds(latlngs), {padding: [24,24]});
    window._maps[elId.replace('map-','')] = map;
    return map;
  }

  buildRouteMap('map-day2', [
    {lat:36.1461, lng:137.2521, label:"高山"},
    {lat:36.1928, lng:137.5868, label:"平湯溫泉"},
    {lat:36.2513, lng:137.6386, label:"上高地"}
  ]);

  buildRouteMap('map-day3', [
    {lat:36.2508, lng:137.6389, label:"白樺莊（上高地）"},
    {lat:36.2617, lng:137.6614, label:"明神橋"},
    {lat:36.2503, lng:137.6382, label:"河童橋"},
    {lat:36.2436, lng:137.6135, label:"大正池"},
    {lat:36.1928, lng:137.5868, label:"平湯溫泉"}
  ]);
</script>
</body>
</html>
